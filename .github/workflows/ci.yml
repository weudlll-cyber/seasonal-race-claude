# ============================================================
# File:        ci.yml
# Path:        .github/workflows/ci.yml
# Project:     RaceArena
# Created:     2026-04-19
# Description: Full QA pipeline — lint, format-check, tests, security audit, living-doc link check
#              Runs on every push and pull request to main / master
#
# WHAT "GREEN" MEANS HERE, since CI-DOCS-ONLY-1 (2026-08-18) it is worth one sentence:
#   All three jobs ALWAYS RUN and always report a conclusion for the SHA. On a push where every
#   changed path is under docs/, reports/ or a root *.md, the client and server jobs skip their
#   lint/format/test STEPS and say so in the log. The audit gates and the whole docs job still run.
#   So green still means "every job examined this commit"; on a docs-only commit it additionally
#   means "and the parts that could not have been affected were not re-run, by name, in the log".
#   A workflow-level `paths:` filter was deliberately NOT used: it produces NO RUN for the SHA, and
#   `gh run list --branch master` would then hand the ceremony the PREVIOUS commit's green run.
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # THE HAND CRANK, and it exists because of a day this repository actually had.
  # On 2026-08-06 GitHub Actions was in a major outage: pushes to master created no workflow run at
  # all, runs that did exist sat queued for over ninety minutes and then died with "the job was not
  # acquired by Runner of type hosted". There was no way to ASK for a run — the only triggers were
  # push and pull_request, and both had already fired and been lost. Re-running a dead run inherits
  # its broken state, so that was no help either.
  #
  # `workflow_dispatch` costs nothing when things work and is the only way back in when they do not.
  # It takes a ref, so it can be pointed at master or at any branch. NOT a substitute for the normal
  # triggers and not a way to skip CI — it runs the same two jobs on the same ref.
  workflow_dispatch:

# ── LEAST PRIVILEGE (CI-PERMISSIONS-1, 2026-08-22) ──────────────────────────────────────────────
# WHAT THIS ACTUALLY BUYS, measured rather than assumed. This repository's setting today is
# `default_workflow_permissions: read` (`gh api repos/:owner/:repo/actions/permissions/workflow`),
# so the workflow was NOT running with a write token and nothing here was exposed. Two things are
# still gained, and they are the honest reasons:
#
#   1. `read` as a DEFAULT means read on EVERY scope — actions, checks, contents, deployments,
#      issues, metadata, packages, pages, pull-requests, security-events, statuses. An explicit
#      block makes every scope not named here `none`. So the reduction is real: read-everything
#      becomes read-contents, for every step including `npm ci`, which runs third-party code.
#   2. THE DEFAULT IS A REPOSITORY SETTING, not a fact about this file. Anyone with admin can flip
#      it to write in the UI and no diff would show it. Declared here, the scope travels with the
#      workflow, survives a settings change, and is reviewable where the jobs are.
#
# READ OFF THE JOBS, NOT COPIED FROM A TEMPLATE. What the three jobs do with the token:
#   actions/checkout@v4      — clones, and persists the token as a git credential   → contents: read
#   scripts/check-tags.mjs   — `git ls-remote --tags origin` through that credential → contents: read
#   everything else          — setup-node, npm ci, npm audit, vitest, node --test: network and
#                              filesystem only, no GitHub API call at all
#
# NOTHING HERE WRITES. No `gh` invocation, no GITHUB_TOKEN reference, no API call in any of the
# three jobs — searching .github/ and scripts/ for `GITHUB_TOKEN`, `gh api`, `gh issue` and `gh pr`
# returns hits only in audit-schedule.yml, which opens and closes an issue and declares
# `issues: write` for exactly that reason. No step posts a comment, cuts a release, publishes a
# package or requests an OIDC token.
#
# SO THE FLOOR IS `contents: read` AND NO JOB NEEDS MORE. If one ever does, scope it at THAT job
# with its own `permissions:` block rather than raising this one — a workflow-level grant reaches
# every step of every job, including the install steps that run other people's code.
permissions:
  contents: read

jobs:
  # ── Client ──────────────────────────────────────────────────
  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      # fetch-depth 0 so the scope step below can diff the push range. Measured at 3 s on this
      # repository — the same depth the docs job has needed since ONE-TRUTH-2 stage 4.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── CI-DOCS-ONLY-1 ────────────────────────────────────────────────────────────────────────
      # THE JOB ALWAYS RUNS AND ALWAYS REPORTS A CONCLUSION FOR THIS SHA. What is conditional is the
      # WORK INSIDE it. That distinction is the whole design: a workflow-level `paths:` filter would
      # mean no run exists for the SHA at all, and "CI green for exactly the merge SHA" would stop
      # being answerable — the ceremony's own `gh run list --branch master` would return the
      # PREVIOUS commit's run and look green. Skipping steps keeps three job conclusions on a run
      # that exists.
      - name: Is this push documentation only?
        id: scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "docs_only=$(node scripts/ci-docs-only.mjs)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # NOT conditional: the audit gate below needs an installed tree, and the audit gate is not
      # conditional either. Measured at 4 s with a warm cache.
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Prettier format check
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run format:check

      # The expensive one: MEASURED at 2m51s on run 32005715842, which is the whole reason this
      # piece exists. Nothing under docs/ or reports/ can change its result.
      - name: Run tests with coverage
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:coverage

      - name: Say what was skipped, and why
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          echo "DOCS-ONLY PUSH — lint, format-check and the client test suite were SKIPPED."
          echo "Every changed path is under docs/, reports/ or a root *.md; none can affect them."
          echo "The security audit gate below still ran: its result is not decided by the diff."

      # Audit policy (HYGIENE-1): FAILS the build on HIGH/CRITICAL, except advisories in the documented
      # ALLOWLIST in scripts/audit-gate.mjs (each with a justification + remove-when condition). MODERATE
      # and below are advisory only. See scripts/audit-gate.mjs.
      - name: Security audit gate (high/critical fail unless allowlisted)
        run: node ../scripts/audit-gate.mjs

  # ── Server ──────────────────────────────────────────────────
  # WIRE-SUITES-1: 19 files and 615 tests that NO invoker ran — not the hook, not `npm run verify`,
  # not CI. They looked like coverage and were none (CHECK-AUDIT-1, 2026-08-15).
  #
  # WIRED ONLY BECAUSE IT IS GREEN. Run on master as it stood, before anything was changed: 615/615
  # in 41.8 s. Not one test was edited to make that true. The e2e suite was run the same way and is
  # NOT here — 85 of 102 failed, and a red suite in the pipeline turns master red and teaches
  # everyone to ignore it. See reports/evolution/WIRE-SUITES-1.md.
  #
  # ITS OWN JOB, not a step inside `client`. The two suites share nothing: different package,
  # different vitest config, different install. A failure here should name the server, and a job
  # that installs the client to test the server would be lying about what broke.
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CI-DOCS-ONLY-1 — same rule, same reasoning as the client job above.
      - name: Is this push documentation only?
        id: scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: echo "docs_only=$(node scripts/ci-docs-only.mjs)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # NOT conditional, and here that costs real time — MEASURED at 1m26s, the largest single step
      # in this job. It stays because the audit gate below audits an INSTALLED tree, which is the
      # property `audit-schedule.yml` relies on to produce the same verdict as this gate. Skipping
      # the install to save that minute would either break that agreement or silently weaken the
      # gate, and the gate is the one thing here whose result the diff does not decide.
      - name: Install dependencies
        run: npm ci

      # HOW THIS SUITE RUNS IS NOT DESCRIBED HERE, and that is deliberate (GATE-SERIAL-BCRYPT-1).
      # What stood here asserted that `--no-file-parallelism` came from the server package's own
      # `npm test`. `20868394` removed that flag on 2026-08-18 and this comment went on asserting it
      # for eight days, while `scripts/verify.mjs` SCHEDULED on the same dead sentence. A guarantee
      # with three owners, and the two being read were the two that had gone stale.
      #
      # The one home is `server/vitest.config.js`, which derives its projects from
      # `server/test/suiteShape.mjs`; verify reads that module rather than a sentence. CI does not
      # schedule anything — it runs `npm test` and the config decides — so there is nothing for this
      # comment to restate and it does not try.
      - name: Run server tests
        if: steps.scope.outputs.docs_only != 'true'
        run: npm test

      - name: Say what was skipped, and why
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          echo "DOCS-ONLY PUSH — the server test suite was SKIPPED."
          echo "Every changed path is under docs/, reports/ or a root *.md; none can affect it."
          echo "The security audit gate below still ran: its result is not decided by the diff."

      # SERVER-AUDIT-1 wired this as REPORT-ONLY because four un-allowlisted HIGH advisories existed
      # on a tree that had never been audited, and failing master over untriaged dependency bumps is
      # how a red build becomes something people learn to ignore.
      #
      # IP-ADDRESS-ADVISORY-1 CLOSED ALL FOUR, so the flag is gone and this BLOCKS like the client
      # gate. They were lockfile-only moves — every fixed version already lay inside the range its
      # dependent declared, so no dependent was bumped and no package.json changed:
      #
      #   ip-address 10.2.0 -> 10.5.0   (express-rate-limit declares ^10.2.0)   PRODUCTION
      #   nanoid     3.3.12 -> 3.3.18   (postcss declares ^3.3.12)              dev-only
      #   postcss    8.5.15 -> 8.5.26   (vite declares ^8.5.15)                 dev-only
      #
      # One LOW advisory remains (body-parser, GHSA-v422-hmwv-36x6). It is printed, never blocking —
      # that is the gate's standing policy for moderate/low and not an exception made for it.
      - name: Security audit gate (server tree — high/critical fail unless allowlisted)
        run: node ../scripts/audit-gate.mjs --tree=server

  # ── Docs ────────────────────────────────────────────────────
  # THIS JOB IS NEVER SKIPPED, AND THAT IS NOT AN OVERSIGHT (CI-DOCS-ONLY-1).
  # It looks like the one job a "docs-only" push obviously needs — and it is also the one job that
  # can never be skipped for a CODE push, because its guards read the WHOLE TREE, not `docs/`:
  #   check-language-closed  declares dirs client/, server/, scripts/, docs/, .claude/
  #   check-fingerprints     scans every tracked file for a copied current fingerprint
  #   check-config-claims    scans docs/ + reports/ AGAINST client/src/modules/storage/defaults.js
  #   script-suite           runs every scripts/**/*.test.mjs
  # So it is unconditional in both directions, and it is what guarantees that EVERY push has at
  # least one job that really examined it. A run always exists and always means something.
  docs:
    name: Living-doc guards + script tests
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY IS NOW REQUIRED (ONE-TRUTH-2 stage 4). It was not before, and the note that
      # used to sit here said so: check-tags.mjs reads the tag list from the REMOTE, so a shallow
      # checkout was faster and sufficient. `check-measured-stamps.mjs` changed that — it asks
      # whether a stamped commit predates a change to the source it measures, which is a question
      # only real history can answer. Under depth 1 every stamp reported its commit as missing, so
      # the guard failed for an environmental reason and said something untrue about the document.
      # The guard now refuses to give a verdict in a shallow clone; this is the other half of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # THE ONE DEPENDENCY THIS JOB HAS, and it is here rather than assumed (FP-PAYLOAD-1).
      # Every guard below was deliberately built with relative imports only, so this job needed no
      # install at all. `check-fingerprint-payload.mjs` breaks that: it must PARSE the payload
      # literal, and a regex over the source would be a partial guard that looks exactly like a
      # complete one. So acorn is a declared devDependency at the ROOT and comes from the lockfile.
      #
      # --omit=optional skips sharp's platform binaries (10+ MB of image codecs no guard touches);
      # --ignore-scripts skips `prepare`, which installs the git hooks and has no job in a runner
      # that makes no commits (docs/VERIFY-RULES.md R12). What remains is acorn, which is pure JS
      # with no dependencies of its own.
      #
      # IF THIS STEP IS EVER REMOVED, the payload guard FAILS rather than skipping — it says so
      # itself. That is deliberate: a guard that cannot parse cannot have an opinion, and a guard
      # that silently checks nothing is worse than no guard.
      - name: Install the parser the payload guard needs
        run: npm ci --omit=optional --ignore-scripts

      # Fails on any dangling relative link in the LIVING docs (docs/ + repo-root *.md).
      # reports/ is excluded by design — it is the lab journal (historical, allowed to rot).
      - name: Check living-doc links
        run: node scripts/check-doc-links.mjs

      # Fails if any report in reports/evolution/ is not referenced from INDEX.md (orphan report).
      - name: Check every report is indexed
        run: node scripts/check-index.mjs

      # reports/night/ and reports/parity/ were outside every guard until ONE-TRUTH-2 stage 5.
      - name: Check night + parity reports are indexed
        run: |
          node scripts/check-index.mjs --dir=reports/night --index=reports/night/INDEX.md
          node scripts/check-index.mjs --dir=reports/parity --index=reports/parity/INDEX.md

      # Fails if any tag at origin is not registered in docs/TAGS.md (undocumented anchor).
      - name: Check every origin tag is registered
        run: node scripts/check-tags.mjs

      # Fails if a CURRENT fingerprint value appears in any tracked file outside docs/fingerprints.json,
      # the declared history homes and the named machine exceptions. Since ONE-TRUTH-2 no document
      # carries a copy at all. This does NOT re-mint against the engine (`--mint` does, ~2 min).
      - name: Check no document carries a copy of a current fingerprint
        run: node scripts/check-fingerprints.mjs

      # Fails if a LIVING document states a config value. Values live in defaults.js and nowhere else,
      # so changing a default can no longer make a document stale. History is allowed its numbers: a
      # dated row, or a document carrying its own `<!-- HISTORICAL: ... -->` mark.
      - name: Check no document states a config value
        run: node scripts/check-config-claims.mjs

      # Fails if a living document restates the fairness threshold, whose one home is docs/FAIRNESS.md.
      # It does NOT guard the track count — see the header of the guard for why that is unbuildable.
      - name: Check no document restates the fairness threshold
        run: node scripts/check-doc-facts.mjs

      # Fails if a key the renderer or the Dev Screen reads has NO default. loadCameraConfig()
      # rebuilds the live config key-by-key from the defaults, so such a key is silently dropped —
      # the control appears to work and the value never arrives. See DEV-MARKERS-1.
      - name: Check every camera key read has a default
        run: node scripts/check-config-keys.mjs

      # Its sibling, and the gap it leaves: check-config-keys asks whether a key EXISTS in the
      # defaults, never whether a MIRROR of it still agrees. minRacersVisible went 3 -> 5 and two
      # mirrors stayed at 3 — the partial-config fallback and the Dev Screen slider. See
      # FALLBACK-GUARD-1. Ships green over an explicit exception list of the 42 known disagreements.
      - name: Check every fallback agrees with the default it mirrors
        run: node scripts/check-fallback-agreement.mjs

      # Fails if the object literal whose keys become the world fingerprint's hashed columns uses
      # SHORTHAND property syntax — where renaming a local variable silently renames an emitted
      # column. That is not hypothetical: it moved the world fingerprint for a byte-identical race
      # and every start row's band hit rate fell to 0.000 (SOLLRANK-KEY-1). It PARSES rather than
      # matching text, which is why the install step above exists.
      - name: Check the hashed fingerprint row uses no shorthand keys
        run: node scripts/check-fingerprint-payload.mjs

      # Fails on German text anywhere in tracked source, scripts and documents, over the FROZEN
      # allowlist of the quotations CLAUDE.md's closing inventory grandfathered on 2026-08-12 plus
      # the pre-existing violations found when it shipped. Entries may be removed from that list;
      # adding one fails its test, which is the asymmetry the closed exception asks for.
      - name: Check the language rule and the closed quotation exception
        run: node scripts/check-language-closed.mjs

      # Fails if a stamped measured number in a document predates a change to the source it measures.
      # FRESHNESS only — it never re-runs the measurement (tracking-lag alone takes ~7 minutes).
      - name: Check measured numbers have not gone stale
        run: node scripts/check-measured-stamps.mjs

      # The guards' own liveness tests (proving they CAN fail) PLUS the sim-observer tests. All are
      # plain node:test with only relative imports — no external deps, so no `npm ci` is needed.
      # `find` enumerates the files so a newly added *.test.mjs is picked up automatically.
      #
      # SELF-ASSERTING INPUT (Lesson 187 — do NOT simplify this away): if `find` returns NOTHING (a
      # rename, a move, a changed extension), `node --test` with no file args does NOT run this suite —
      # it either runs zero tests (a green, silent no-op) or discovers unrelated repo-wide tests. So the
      # discovered list is asserted non-empty and the step FAILS LOUDLY before node --test is invoked,
      # the same discipline the guards themselves use.
      - name: Run script test suite (guard liveness + observers)
        run: |
          files=$(find scripts -name '*.test.mjs')
          test -n "$files" || { echo "FAIL: no script test files found under scripts/ (find returned nothing). A green run with zero tests is the Lesson-187 no-op trap; refusing to pass."; exit 1; }
          node --test $files
