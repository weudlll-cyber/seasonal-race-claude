services:
  server:
    build:
      # IMAGE-STANDALONE-1: the context is the REPOSITORY ROOT, so the Dockerfile can reach
      # `shared/nameLimits.mjs` — the one file the server imports from outside `server/`. What is
      # actually sent is decided by the root `.dockerignore`, which is an allow-list; without it this
      # context would be ~1.3 GB and would carry `server/data/`'s credential files into the image.
      context: .
      dockerfile: server/Dockerfile
      # ★★ `additional_contexts: client: ./client` WAS HERE AND IS GONE (the owner's decision,
      # 2026-09-23). The built client used to be handed in through a NAMED build context, which meant
      # `npm run build` in `client/` had to have been run BY HAND first — so a recipient holding only
      # the repository could not produce the image. `server/Dockerfile` now has a `client-build`
      # stage that runs `npm ci && npm run build` itself, so nothing needs supplying and
      # `docker build -f server/Dockerfile .` is enough on its own.
      # Measured cost of the change, cold cache: 328 s -> 336 s, +8 s (+2.4%).
    ports:
      - "4000:4000"
    # ── INSTALL-SECRETS-1: a container that dies must not sit there dead ─────────────────────────
    # Nothing noticed a server that started and then exited: no HEALTHCHECK, no restart policy. The
    # image now declares a HEALTHCHECK against `/api/health` (server/Dockerfile), so `docker ps`
    # reports healthy/unhealthy rather than merely "Up", and this line brings it back when it dies.
    # `unless-stopped` rather than `always`, so an operator who deliberately stops it stays stopped.
    restart: unless-stopped
    environment:
      - PORT=4000
      # ★ `RA_BOOTSTRAP_TOKEN=dev-bootstrap-token-not-for-production` STOOD HERE AND IS GONE
      # (INSTALL-SECRETS-1, 2026-09-08). It was overridden on any real install, but a stranger who
      # ran a plain `docker compose up` got a WORKING bootstrap token whose value is in the public
      # repository — which is the one credential that opens a fresh install's first admin account.
      #
      # There is no fallback now, and that is the point: with the variable unset,
      # `POST /api/auth/setup` answers 403 and `startupReadinessLines()` says so at boot. An install
      # that cannot be opened is a loud, fixable state; an install anybody can open is not.
      #
      # `npm run configure` GENERATES this and RA_SESSION_SECRET into docker-compose.override.yml,
      # unique per install and never printed. That is the supported way to get one.
      # RA_CLIENT_DIST is NOT set here any more: IMAGE-STANDALONE-1 made the image declare its own
      # layout with an ENV, so a plain `docker run` serves the app too. One home for the fact.
      # RA_SESSION_SECRET and RA_CLIENT_ORIGIN come from docker-compose.override.yml
      # (gitignored). Copy docker-compose.override.yml.example to get started.
    # Volume mounts so code changes never require a full `docker compose build`.
    # Just `docker compose restart server` (or rely on --watch auto-reload below).
    #
    # Rebuild IS still required when:
    #   - package.json changes (new/removed npm dependencies)
    #   - Dockerfile itself changes
    volumes:
      - ./server/src:/app/src         # live code — src changes visible without rebuild
      - ./server/utils:/app/utils     # utils helpers (atomicWriteJson etc.) — not in original Dockerfile COPY
      - ./server/data:/app/data       # surface-class JSON files persist across rebuilds
      # SEED-REDELIVERY-1: the SHIPPED records, and this mount is load-bearing rather than a
      # convenience. The Dockerfile COPYs `seeds/` at build time, so without it the container
      # carries whatever was baked into the last image — which had no `versions.json` at all,
      # making `readManifest()` return `{}` and delivery a permanent no-op. A baked-in seeds
      # directory means A DELIVERY SILENTLY NEVER ARRIVES, which is the exact failure this
      # whole strand was built to end, one level down in the deployment. Mounted like `src`
      # and `data` so a raised version reaches the running container on a restart.
      - ./server/seeds:/app/seeds     # shipped seed records + versions.json — see above
      # `shared/` IS NO LONGER MOUNTED, and that is the point of IMAGE-STANDALONE-1. It used to be
      # the one thing the container could not run without, because the build context was `./server`
      # and no COPY could reach a directory above it. The context is the repository root now and the
      # image COPIES `shared/nameLimits.mjs`, so the mount would supply something the image already
      # has — and keeping it would hide the very property this piece exists to establish: run the
      # image with no mounts at all and it works.
      #
      # The cost, stated: editing `shared/nameLimits.mjs` now needs `docker compose build` rather
      # than a restart. It is one 4.5 KB constants file, and clarity about what the image contains is
      # worth more than live-editing it.
      # `- /app/node_modules` WAS HERE AND IS DELETED (DEPS-SERVER-AUDIT-1, 2026-09-04). It was an
      # anonymous volume, and its comment said it kept "the container's npm install isolated from
      # host" — but NOTHING mounts over /app or /app/node_modules. The four binds above are
      # /app/src, /app/utils, /app/data and /app/seeds. There was nothing to isolate it from; the
      # line is left over from when the mount was `./server:/app`.
      #
      # WHAT IT ACTUALLY DID, and this was measured rather than reasoned. An anonymous volume is
      # populated from the image ONCE, when the container is first created, and then persists. So
      # `docker compose up -d --build` recreated the container, mounted the SAME two-day-old volume,
      # and the running server kept the old dependency tree. Caught on exactly the change that
      # exposes it: after the qs override the IMAGE had `qs 6.16.0` and the RUNNING CONTAINER
      # reported `qs 6.15.3` — the vulnerable one — from a rebuild that reported success.
      #
      # THAT IS THE SEED-REDELIVERY FAILURE ONE LAYER DOWN: a delivery that silently never arrives,
      # while everything says it did. The seeds mount above exists because of the same shape.
    # node --watch (Node 20 built-in) auto-restarts on src file changes.
    # Note: on Windows Docker Desktop, file-change events across the WSL2 boundary
    # can be slow; if auto-restart doesn't fire, use `docker compose restart server`.
    command: node --watch src/index.js
