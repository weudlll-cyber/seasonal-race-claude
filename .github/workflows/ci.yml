# ============================================================
# File:        ci.yml
# Path:        .github/workflows/ci.yml
# Project:     RaceArena
# Created:     2026-04-19
# Description: Full QA pipeline — lint, format-check, tests, security audit, living-doc link check
#              Runs on every push and pull request to main / master
# ============================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Client ──────────────────────────────────────────────────
  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:coverage

      # Audit policy (HYGIENE-1): FAILS the build on HIGH/CRITICAL, except advisories in the documented
      # ALLOWLIST in scripts/audit-gate.mjs (each with a justification + remove-when condition). MODERATE
      # and below are advisory only. See scripts/audit-gate.mjs.
      - name: Security audit gate (high/critical fail unless allowlisted)
        run: node ../scripts/audit-gate.mjs

  # ── Docs ────────────────────────────────────────────────────
  docs:
    name: Living-doc guards + script tests
    runs-on: ubuntu-latest
    steps:
      # A default (shallow) checkout is sufficient: check-tags.mjs reads the tag list from the REMOTE
      # (`git ls-remote --tags origin`), not from the local checkout, so fetching tags here is
      # unnecessary — and a shallow checkout is faster. If the remote query returns nothing the guard
      # FAILS LOUD by design (see scripts/check-tags.mjs), so a broken remote breaks the build.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails on any dangling relative link in the LIVING docs (docs/ + repo-root *.md).
      # reports/ is excluded by design — it is the lab journal (historical, allowed to rot).
      - name: Check living-doc links
        run: node scripts/check-doc-links.mjs

      # Fails if any report in reports/evolution/ is not referenced from INDEX.md (orphan report).
      - name: Check every report is indexed
        run: node scripts/check-index.mjs

      # Fails if any tag at origin is not registered in docs/TAGS.md (undocumented anchor).
      - name: Check every origin tag is registered
        run: node scripts/check-tags.mjs

      # Fails if any document disagrees with docs/fingerprints.json about a CURRENT fingerprint, if
      # a declared site has lost its anchor, or if an undeclared file has started stating one.
      # It compares documents to the RECORD; it does not re-run the six-minute fingerprint scripts.
      - name: Check the fingerprint record and every site that copies it
        run: node scripts/check-fingerprints.mjs

      # The guards' own liveness tests (proving they CAN fail) PLUS the sim-observer tests. All are
      # plain node:test with only relative imports — no external deps, so no `npm ci` is needed.
      # `find` enumerates the files so a newly added *.test.mjs is picked up automatically.
      #
      # SELF-ASSERTING INPUT (Lesson 187 — do NOT simplify this away): if `find` returns NOTHING (a
      # rename, a move, a changed extension), `node --test` with no file args does NOT run this suite —
      # it either runs zero tests (a green, silent no-op) or discovers unrelated repo-wide tests. So the
      # discovered list is asserted non-empty and the step FAILS LOUDLY before node --test is invoked,
      # the same discipline the guards themselves use.
      - name: Run script test suite (guard liveness + observers)
        run: |
          files=$(find scripts -name '*.test.mjs')
          test -n "$files" || { echo "FAIL: no script test files found under scripts/ (find returned nothing). A green run with zero tests is the Lesson-187 no-op trap; refusing to pass."; exit 1; }
          node --test $files
